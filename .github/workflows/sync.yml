name: Sync Kaseya Center Events

on:
  schedule:
    # Runs at 9:00 AM UTC on the 1st and 15th of every month
    - cron: '0 9 1,15 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write # Required to commit and push events.ics

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape and generate events.ics
        run: node src/sync.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.ics
          git diff --staged --quiet || git commit -m "Update events.ics [$(date -u +%Y-%m-%d)]"
          git push
